name: Windows x64 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v143 -DCMAKE_SYSTEM_VERSION=10.0.26100.0 -DVIEWERY_MEDIA_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download pinned runtime tools
        shell: pwsh
        run: ./scripts/Get-MediaTools.ps1 -Destination build/bin/Release -IncludeProbe
      - name: Test real photo, VFR GIF, VFR video and GIF export
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate full MSIX and assemble portable ZIP
        shell: pwsh
        run: |
          $configuration = Get-Content -LiteralPath CMakeLists.txt -Raw
          $match = [regex]::Match($configuration,'set\(VIEWERY_VERSION "([^"]+)"')
          if (-not $match.Success) { throw 'Version not found in CMakeLists.txt.' }
          $version = $match.Groups[1].Value
          $channel = if ($version.Contains('-beta.')) { 'beta' } else { 'stable' }
          ./scripts/Build-Release.ps1 -BuildDirectory build/bin/Release -Destination dist -Version $version -Channel $channel
      - uses: actions/upload-artifact@v4
        with:
          name: Viewery-Windows-x64
          if-no-files-found: error
          path: dist/
